name: "Infer static analyzer"
on:
  push:
    branches:
      - 'master'
      - 'release-[0-9]+.[0-9]+'
  pull_request:
    branches:
      - 'master'
      - 'release-[0-9]+.[0-9]+'
    paths-ignore:
      - 'runtime/doc/*'
jobs:
  run-infer:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo add-apt-repository ppa:neovim-ppa/stable
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential ccache cmake curl doxygen flake8 g++ gettext libluajit-5.1-dev libmsgpack-dev libtermkey-dev libtool libtool-bin libtree-sitter-dev libunibilium-dev libuv1-dev libvterm-dev locales lua-busted lua-check lua-system lua-filesystem lua-inspect luajit lua-lpeg lua-luv-dev lua-nvim ninja-build pkg-config unzip
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr_nvim
      - run: |
          VERSION=$(curl -s https://api.github.com/repos/facebook/infer/releases/latest | grep "tag_name" | grep -o "v[0-9.]*")
          echo "Detected infer version is ${VERSION}"
          curl -sL "https://github.com/facebook/infer/releases/download/${VERSION}/infer-linux64-${VERSION}.tar.xz" | tar xvJ
          export PATH="$PWD/infer-linux64-${VERSION}/bin:$PATH"
          infer --version
          sudo find /usr -iname librt.so -exec ln -s '{}' /usr/local/lib ';'
          (cd pr_nvim ; infer run \
            --skip-analysis-in-path /tmp \
            --skip-analysis-in-path .deps \
            --disable-issue-type +DEAD_STORE \
            --biabduction \
            --bufferoverrun \
            --loop-hoisting \
            --pulse \
            --racerd \
            --siof \
            --starvation \
            -- make CMAKE_BUILD_TYPE=Release )
          cat pr_nvim/infer-out/report.txt
